# Reruns of ts10m_main (same configs) that save checkpoints densely around the losses of AdamW at steps 272, 397,
# 680, 1440, 3300, 5000 and 7500 (training loss 2.7, 2.4, 2.1, 1.81, 1.6, 1.50, 1.40 on the probe) and, for Muon,
# around the steps where it reaches them and near 1.31 (the final loss of AdamW), and no others, so that AdamW and
# Muon checkpoints can be matched in loss for the constant-loss paths (optsplit/analysis/level_paths.py).
# Measurements off; probe every 1000 steps (storage).
suite: ts10m_level_paths
base: ../base/tinystories_10m.yaml
overrides:
  optim.adamw.lr: 2.0e-3
  optim.muon.lr: 0.01
  measure.hessian: false
  measure.delta_loss: false
  log.eval_steps.every: 1000
  log.eval_steps.geometric: 0
  log.ckpt_steps.every: 0
  log.ckpt_steps.geometric: 0
name: "{optimizer}_d{train.data_seed}"
runs:
  - optimizer: adamw
    train.data_seed: [0, 1]
    log.ckpt_steps.extra: [[258, 260, 262, 264, 266, 268, 270, 272, 274, 276, 278, 280, 282, 284, 286, 288,
                              382, 385, 388, 391, 394, 397, 400, 403, 406, 409, 412,
                              650, 656, 662, 668, 674, 680, 686, 692, 698, 704, 710,
                              1340, 1360, 1380, 1400, 1420, 1440, 1460, 1480, 1500, 1520,
                              2900, 3000, 3100, 3200, 3300, 3400, 3500, 3600, 3700,
                              4850, 4875, 4900, 4925, 4950, 4975, 5000, 5025, 5050, 5075, 5100, 5125, 5150,
                              7350, 7375, 7400, 7425, 7450, 7475, 7500, 7525, 7550, 7575, 7600, 7625, 7650]]
  - optimizer: muon
    train.data_seed: [0, 1]
    log.ckpt_steps.extra: [[202, 204, 206, 208, 210, 212, 214, 216, 218, 220, 222, 224,
                              266, 268, 270, 272, 274, 276, 278, 280, 282, 284, 286, 288, 290, 292,
                              390, 393, 396, 399, 402, 405, 408, 411, 414, 417, 420, 423, 426,
                              780, 795, 810, 825, 840, 855, 870, 885, 900, 915, 930,
                              1800, 1850, 1900, 1950, 2000, 2050, 2100, 2150, 2200, 2250,
                              3150, 3175, 3200, 3225, 3250, 3275, 3300, 3325, 3350, 3375, 3400, 3425, 3450, 3475,
                              3500, 3525, 3550, 3575, 3600, 3625, 3650,
                              5500, 5525, 5550, 5575, 5600, 5625, 5650, 5675, 5700, 5725, 5750, 5775, 5800, 5825,
                              5850, 5875, 5900, 5925, 5950, 5975, 6000, 6025, 6050, 6075, 6100, 6125, 6150, 6175, 6200,
                              7200, 7300, 7400, 7500, 7600, 7700, 7800]]
