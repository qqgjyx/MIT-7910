# ts10m_mse_tt with the cross-entropy loss, LC only: U S^p V^T at p = -0.3 by a weighted sum of Newton-Schulz iterates
# (optim.muon.lc_steps = 12, 8, 6, 5; 3 matrix products per step) instead of an SVD, against the exact runs of
# ts10m_ce_svp, at Muon's rate 0.01, data orders 0-2. -0.3 is the only power with LC coefficients for 8 and 12 steps.
# Two-track Newton-Schulz is not rerun: under MSE, LC was as good or better at every cost. References:
# ts10m_ce_svp/muon_p-0.3_lr0.01_d0-d2 (exact) and ts10m_main/muon_d0-d2. At the log.two_track_check steps a run logs
# the error of every method against the exact update on its own momentum. Kept small: no measurements, no stored
# outputs, no optimizer state, checkpoints every 1000 steps.
# Equal GPU time: LC12 with its whole schedule (warmup and cosine decay) shrunk to the GPU time of 10,000 Muon steps,
# 7391 steps = 10,000 x 117.3 / 158.7 ms per step (Muon / LC12, timed side by side on one L40S in ts10m_ce_tt_pilot).
suite: ts10m_ce_tt
base: ../base/tinystories_10m.yaml
overrides:
  optimizer: muon
  optim.muon.lr: 0.01
  optim.muon.sv_power: -0.3
  measure.hessian: false
  measure.delta_loss: false
  log.preds: false
  log.ckpt_optimizer: false
  log.ckpt_steps: {every: 1000, geometric: 0}
  log.two_track_check: [10, 100, 300, 1000, 2000, 3000, 5000, 7000, 9000]
runs:
  - {optim.muon.lc_steps: [12, 8, 6, 5], train.data_seed: [0, 1, 2],
     name: "muon_p{optim.muon.sv_power}_lc{optim.muon.lc_steps}_d{train.data_seed}"}
  - {optim.muon.lc_steps: 12, train.max_steps: 7391, schedule.warmup_steps: 148, train.data_seed: [0, 1, 2],
     name: "muon_p{optim.muon.sv_power}_lc12_eqtime_d{train.data_seed}"}
