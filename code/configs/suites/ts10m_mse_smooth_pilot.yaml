# Calibration of smoothed Muon (optimizer smuon, DESIGN.md) with the MSE loss, on data order 0: the smoothing constant a
# (optim.smuon.smooth) at Muon's learning rate 0.005, then learning rates around it at the chosen a. The checkpoints
# are the triples t, t+1, t+2 of ts10m_mse_main, so the cosine of consecutive updates is read at the same steps as for
# its AdamW and Muon runs (python -m optsplit.analysis.update_cosine 'ts10m_mse_smooth_pilot/*'). No sharpness
# measurements; the stored outputs are thinned to 4 positions per probe sequence. ckpt/ goes to scratch
# (slurm/scratch_links.sh).
suite: ts10m_mse_smooth_pilot
base: ../base/tinystories_10m.yaml
overrides:
  train.loss: mse
  optimizer: smuon
  measure.hessian: false
  measure.batch_sharpness_batches: 0
  measure.delta_loss: false
  probe.positions_per_seq: 4
  log.ckpt_steps: {every: 1000, geometric: 12, extra: [25, 26, 27, 50, 51, 52, 100, 101, 102, 150, 151, 152, 200, 201,
    202, 250, 251, 252, 300, 301, 302, 400, 401, 402, 500, 501, 502, 600, 601, 602, 800, 801, 802, 1000, 1001, 1002,
    1250, 1251, 1252, 1500, 1501, 1502, 2000, 2001, 2002, 2500, 2501, 2502, 3000, 3001, 3002, 4000, 4001, 4002,
    5000, 5001, 5002, 6000, 6001, 6002, 7000, 7001, 7002, 8000, 8001, 8002, 9000, 9001, 9002, 9998, 9999]}
name: "smuon_a{optim.smuon.smooth}_lr{optim.smuon.lr}"
runs:
  - {optim.smuon.smooth: [0.4, 0.5, 0.6, 0.7, 0.8], optim.smuon.lr: 0.005}
  - {optim.smuon.smooth: [0.65, 0.75], optim.smuon.lr: 0.005}
  - {optim.smuon.smooth: 0.6, optim.smuon.lr: [0.0025, 0.01, 0.00125, 0.02]}  # the learning-rate sweep
