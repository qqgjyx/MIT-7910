# Smoothed Muon (optimizer smuon, DESIGN.md) with the MSE loss, as the AdamW and Muon runs of ts10m_mse_main: same
# initialization, data orders 0-4, measurements, stored outputs and checkpoints (the triples t, t+1, t+2 at 24 points).
# Here all five orders keep the triples (orders 0-2 also the optimizer state at each, opt/). The d0 run keeps AdamW's
# and Muon's state in shadow and saves fork checkpoints for ts10m_mse_smooth_forks, at the nine fork steps and at 6000, 7500, 9000.
# Smoothing constant and learning rate from ts10m_mse_smooth_pilot: a = 0.6 brings the cosine of consecutive updates to
# AdamW's, and 0.005 is the best of five rates at that a. optim.adamw.lr and optim.muon.lr (the shadows; the swaps
# inherit this config) are those of ts10m_mse_main. ckpt/, opt/, preds/ and fork/ go to scratch (slurm/scratch_links.sh).
suite: ts10m_mse_smooth
base: ../base/tinystories_10m.yaml
overrides:
  train.loss: mse
  optimizer: smuon
  optim.smuon.smooth: 0.6
  optim.smuon.lr: 0.005
  optim.adamw.lr: 2.0e-3
  optim.muon.lr: 0.005
  log.ckpt_steps: {every: 1000, geometric: 12, extra: [25, 26, 27, 50, 51, 52, 100, 101, 102, 150, 151, 152, 200, 201,
    202, 250, 251, 252, 300, 301, 302, 400, 401, 402, 500, 501, 502, 600, 601, 602, 800, 801, 802, 1000, 1001, 1002,
    1250, 1251, 1252, 1500, 1501, 1502, 2000, 2001, 2002, 2500, 2501, 2502, 3000, 3001, 3002, 4000, 4001, 4002,
    5000, 5001, 5002, 6000, 6001, 6002, 7000, 7001, 7002, 8000, 8001, 8002, 9000, 9001, 9002, 9998, 9999]}
name: "{optimizer}_d{train.data_seed}"
runs:
  - {train.data_seed: 0, log.ckpt_optimizer: true, shadow: [[adamw, muon]],
     log.fork_steps: [[50, 100, 200, 400, 700, 1000, 1500, 2500, 4000, 6000, 7500, 9000]]}
  - {train.data_seed: [1, 2], log.ckpt_optimizer: true}
  - {train.data_seed: [3, 4]}
