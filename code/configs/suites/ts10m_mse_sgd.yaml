# SGD with momentum under the MSE loss, the reference of the appendix table: data orders 0-2 with the checkpoints of
# ts10m_traj and the optimizer state at each (ckpt/ and opt/ on scratch: slurm/scratch_links.sh).
# Learning rate: 0.02, the best final validation loss of the ten rates in ts10m_mse_lrsweep (0.045 collapses to the
# all-zero output, 0.06 and above diverge). SGD stays near the unigram level (loss 0.96; unigram 0.986).
suite: ts10m_mse_sgd
base: ../base/tinystories_10m.yaml
overrides:
  train.loss: mse
  optim.sgd.lr: 0.02
  log.ckpt_optimizer: true
  log.ckpt_steps: {every: 1000, geometric: 12, extra: [25, 26, 27, 50, 51, 52, 100, 101, 102, 150, 151, 152, 200, 201,
    202, 250, 251, 252, 300, 301, 302, 400, 401, 402, 500, 501, 502, 600, 601, 602, 800, 801, 802, 1000, 1001, 1002,
    1250, 1251, 1252, 1500, 1501, 1502, 2000, 2001, 2002, 2500, 2501, 2502, 3000, 3001, 3002, 4000, 4001, 4002,
    5000, 5001, 5002, 6000, 6001, 6002, 7000, 7001, 7002, 8000, 8001, 8002, 9000, 9001, 9002, 9998, 9999]}
name: "{optimizer}_d{train.data_seed}"
runs:
  - {optimizer: sgd, train.data_seed: [0, 1, 2]}
