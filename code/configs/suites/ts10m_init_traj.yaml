# Init seeds 1 and 2 (data order 0) of the CE checkpoint's AdamW and Muon runs: ts10m_traj (its logging, Hessian
# measurements and checkpoint triples t, t+1, t+2 at 24 points), with train.init_seed. The whole-model metrics (Fig 2,
# the tables) and the JS between AdamW and Muon (Fig 1) per init; Muon and AdamW are also the references of the
# init-seed dose and LC runs. Runs go to ts10m_traj_i1/, ts10m_traj_i2/ under the original names.
suite: ts10m_traj_i{train.init_seed}
base: ../base/tinystories_10m.yaml
overrides:
  optim.sgd.lr: 0.06
  optim.adamw.lr: 2.0e-3
  optim.muon.lr: 0.01
  log.ckpt_steps: {every: 1000, geometric: 12, extra: [25, 26, 27, 50, 51, 52, 100, 101, 102, 150, 151, 152, 200, 201,
    202, 250, 251, 252, 300, 301, 302, 400, 401, 402, 500, 501, 502, 600, 601, 602, 800, 801, 802, 1000, 1001, 1002,
    1250, 1251, 1252, 1500, 1501, 1502, 2000, 2001, 2002, 2500, 2501, 2502, 3000, 3001, 3002, 4000, 4001, 4002,
    5000, 5001, 5002, 6000, 6001, 6002, 7000, 7001, 7002, 8000, 8001, 8002, 9000, 9001, 9002, 9998, 9999]}
name: "{optimizer}_d{train.data_seed}"
runs:
  - {optimizer: [adamw, muon], train.data_seed: 0, train.init_seed: [1, 2]}
